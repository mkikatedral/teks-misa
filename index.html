<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Teks Misa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link
      href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&display=swap"
      rel="stylesheet"
    />
    <script
      defer
      src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"
    ></script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"
    ></script>
    <!-- SweetAlert2 (Lightweight Modal) -->
    <script defer src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
      html.embedded.autosized:not(.fs-active) #buku-misa-container .toolbar {
        transform: translateY(var(--vp-top, 0px));
        will-change: transform;
      }
      /* Apply page background only when opened standalone (not inside WordPress) */
      body:not(:has(#misa-widget-root)) {
        margin: 0;
        padding: 0;
        background: #f7f5f0;
      }

      #misa-widget-root #buku-misa-container {
        min-height: 0;
      }

      /* === THEMED SCROLLBAR, ON THE LEFT (Fullscreen & standalone only) === */
      html:not(:has(#misa-widget-root)),
      #buku-misa-container:fullscreen {
        direction: rtl;
      }
      #buku-misa-container:-webkit-full-screen {
        direction: rtl;
      }
      #buku-misa-container .viewer {
        direction: ltr;
      }
      #buku-misa-container * {
        scrollbar-width: thin;
        scrollbar-color: #966331 #f7f5f0;
      }
      #buku-misa-container ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      #buku-misa-container ::-webkit-scrollbar-track {
        background: #f7f5f0;
      }
      #buku-misa-container ::-webkit-scrollbar-thumb {
        background: #966331;
        border-radius: 10px;
        border: 2px solid #f7f5f0;
      }
      #buku-misa-container ::-webkit-scrollbar-thumb:hover {
        background: #5f3f1f;
      }
      #buku-misa-container * {
        box-sizing: border-box;
      }

      #buku-misa-container {
        font-family: "Roboto", "Inter", sans-serif;
        background: #f7f5f0;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 0 15px 30px;
        position: relative;
      }

      #buku-misa-container .viewer {
        width: 100%;
        max-width: 1500px;
        transition: max-width 0.4s ease-in-out;
      }

      /* === CHURCH THEMED TOOLBAR === */
      #buku-misa-container .toolbar {
        position: sticky;
        top: 0;
        z-index: 100;
        background: #966331;
        border-bottom: 3px solid #5f3f1f;
        color: #fdfbf7;
        border-radius: 0 0 8px 8px;
        padding: 12px 20px;
        margin-bottom: 25px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        box-shadow: 0 10px 30px rgba(91, 35, 38, 0.15);
      }

      #buku-misa-container #pdfList {
        flex: 1;
        min-width: 180px;
        max-width: 100%;
        padding: 10px 15px;
        border-radius: 6px;
        background: #966331;
        color: #fdfbf7;
        border: 1px solid #ffffff;
        font-family: "Roboto", "Inter", sans-serif;
        font-weight: 600;
        font-size: 15px;
        cursor: pointer;
        outline: none;
      }

      #buku-misa-container #pdfList option {
        background: #f7f5f0;
        color: #333;
      }

      #buku-misa-container button {
        background: transparent;
        color: #ffffff;
        border: 1px solid #ffffff;
        padding: 8px 15px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 900;
        font-family: "Roboto", "Inter", sans-serif;
        letter-spacing: 0.5px;
        white-space: nowrap;
        transition: all 0.3s ease;
      }

      #buku-misa-container button:hover {
        background: #ffffff;
        color: #000000;
      }

      #buku-misa-container #refreshBtn {
        background: #5f3f1f;
      }
      #buku-misa-container #refreshBtn:hover {
        background: #ffffff;
        color: #000000;
      }

      /* === IMAGE LIGHTBOX STYLES === */
      .lightbox-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.85);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 10000;
        opacity: 0;
        visibility: hidden;
        transition:
          opacity 0.3s ease,
          visibility 0.3s ease;
      }

      .lightbox-overlay.show {
        opacity: 1;
        visibility: visible;
      }

      .lightbox-overlay img {
        width: 100%; /* Force width to allow natural horizontal swiping/zooming on mobile */
        min-width: 800px; /* Makes the QR codes large enough to scan instantly */
        max-width: none;
        background: white;
        padding: 10px;
        border-radius: 8px;
        cursor: grab;
      }

      /* Scrollable wrapper for the enlarged lightbox image */
      .lightbox-scroll-wrapper {
        width: 95%;
        max-height: 90vh;
        overflow-x: auto;
        overflow-y: hidden;
        -webkit-overflow-scrolling: touch;
        border-radius: 8px;
      }

      .lightbox-close {
        position: absolute;
        top: 20px;
        right: 30px;
        font-size: 40px;
        color: white;
        cursor: pointer;
        font-weight: bold;
        z-index: 10001;
      }

      /* === FIX: ALLOW NATIVE 2D SCROLLING (VERTICAL + HORIZONTAL) WHEN ZOOMED === */
      #buku-misa-container.is-zoomed #flipbook,
      #buku-misa-container.is-zoomed .stf__parent,
      #buku-misa-container.is-zoomed .stf__wrapper,
      #buku-misa-container.is-zoomed .stf__block,
      #buku-misa-container.is-zoomed .stf__item {
        touch-action: pan-x pan-y !important;
      }

      #buku-misa-container.is-zoomed #flipbook-wrapper {
        max-height: calc(100dvh - 110px);
        overscroll-behavior: contain;
      }

      html.embedded.autosized:not(.fs-active)
        #buku-misa-container.is-zoomed
        #flipbook-wrapper {
        max-height: max(320px, calc(var(--vp-height, 75vh) - 95px));
      }

      /* === FLIPBOOK CONTAINER === */
      /* === ZOOM CONTROLS (Updated for Tooltip) === */
      #buku-misa-container .zoom-controls {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        font-weight: 600;
        font-size: 14px;
        position: relative; /* REQUIRED for the tooltip to anchor correctly */
      }

      #buku-misa-container #zoomSlider {
        cursor: pointer;
        width: 100px;
        accent-color: #f7f5f0;
      }

      /* === THE TOOLTIP STYLES === */
      #buku-misa-container .zoom-tooltip {
        position: absolute;
        bottom: 140%; /* Spacing above the slider */
        left: 50%;
        transform: translateX(-50%);
        background-color: #5f3f1f; /* Matches your dark brown theme */
        color: #fdfbf7;
        padding: 10px 15px;
        border-radius: 6px;
        font-size: 13px;
        font-weight: 400;
        text-align: center;
        white-space: nowrap;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        opacity: 0;
        visibility: hidden;
        transition:
          opacity 0.3s ease,
          visibility 0.3s ease;
        z-index: 150;
        pointer-events: none; /* Prevents it from blocking clicks */
      }

      /* Tooltip Triangle Pointer */
      #buku-misa-container .zoom-tooltip::after {
        content: "";
        position: absolute;
        top: 100%;
        left: 50%;
        margin-left: -6px;
        border-width: 6px;
        border-style: solid;
        border-color: #5f3f1f transparent transparent transparent;
      }

      /* Class to trigger the fade-in */
      #buku-misa-container .zoom-tooltip.show {
        opacity: 1;
        visibility: visible;
      }

      /* Prevent tooltip from going off-screen on very small phones */
      @media (max-width: 768px) {
        /* FLIP THE TOOLTIP DOWNWARD ON MOBILE */
        #buku-misa-container .zoom-tooltip {
          white-space: normal;
          width: 260px;
          line-height: 1.4;

          /* Remove the upward positioning */
          bottom: auto;

          /* Push it below the slider so it doesn't go off the top of the screen */
          top: 140%;
        }

        /* FLIP THE TRIANGLE POINTER TO POINT UP */
        #buku-misa-container .zoom-tooltip::after {
          top: auto;
          bottom: 100%;
          border-color: transparent transparent #5f3f1f transparent;
        }
      }

      /* === UPDATE EXISTING FLIPBOOK WRAPPER === */
      #buku-misa-container #flipbook-wrapper {
        background: transparent;
        display: flex;
        justify-content: center;

        /* FIX: Start alignment at the top so tall books don't push into unscrollable negative space */
        align-items: flex-start;

        padding: 0;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
        border-radius: 4px;

        /* CHANGE: Allow all native scrolling directions */
        touch-action: auto;

        overflow-anchor: none;
        overflow: auto;
        transform: translateZ(0);
        /* max-height: 70vh; */
      }

      /* === ADD TRANSITION TO FLIPBOOK === */
      #buku-misa-container #flipbook {
        width: 100%;
        display: flex;
        justify-content: center;

        /* THE FIX: Force native vertical scroll (pan-y) and pinch-zoom */
        touch-action: pan-y pinch-zoom !important;

        transition: transform 0.2s ease-out;
        transform-origin: top left;
      }

      /* THE FIX: Also apply to the dynamically generated page-flip elements */
      #buku-misa-container .st-page {
        touch-action: pan-y pinch-zoom !important;
      }

      #buku-misa-container .page {
        background: white;
        border-radius: 2px;
        overflow: hidden;
        box-shadow:
          inset -1px 0 5px rgba(0, 0, 0, 0.05),
          0 5px 15px rgba(0, 0, 0, 0.15);
      }

      #buku-misa-container .page canvas {
        width: 100%;
        height: 100%;
        /* FIX: Ensure canvas doesn't blur on resize */
        object-fit: contain;
      }

      #buku-misa-container #pageNumber {
        width: 100%;
        margin-top: 20px;
        text-align: center;
        font-weight: 600;
        font-size: 15px;
        color: #966331;
        letter-spacing: 1px;
      }

      #buku-misa-container #loading {
        position: fixed;
        inset: 0;
        background: rgba(247, 245, 240, 0.9);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        font-size: 20px;
        color: #966331;
        z-index: 9999;
        display: none;
      }

      /* SweetAlert Church Theme Border */
      .swal2-border-theme {
        border-top: 6px solid #966331 !important;
        border-bottom: 6px solid #966331 !important;
        border-radius: 8px !important;
      }
      /* === EXTRACTED LINKS SECTION === */
      #buku-misa-container #pdf-links-section {
        width: 100%;
        margin-top: 30px;
        padding: 20px;
        background: #ffffff;
        border: 1px solid #966331;
        border-radius: 8px;
        box-shadow: 0 4px 15px rgba(91, 35, 38, 0.05);
      }
      #buku-misa-container #pdf-links-section h3 {
        color: #966331;
        margin-top: 0;
        margin-bottom: 15px;
        font-size: 18px;
        font-weight: 600;
        border-bottom: 2px solid #f7f5f0;
        padding-bottom: 10px;
      }
      #buku-misa-container #pdf-links-list {
        list-style: none;
        padding: 0;
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      #buku-misa-container #pdf-links-list li a {
        display: block;
        padding: 12px 15px;
        background: #f7f5f0;
        color: #5f3f1f;
        text-decoration: none;
        border-radius: 6px;
        font-weight: 600;
        font-size: 14px;
        transition: all 0.3s ease;
        word-break: break-all;
        border-left: 4px solid #966331;
      }
      #buku-misa-container #pdf-links-list li a:hover {
        background: #966331;
        color: #ffffff;
        border-left-color: #5f3f1f;
      }

      /* === GOOGLE DRIVE FALLBACK BUTTON === */
      #buku-misa-container .drive-fallback-container {
        width: 100%;
        text-align: center;
        margin-top: 30px;
        padding-top: 20px;
        border-top: 2px dashed #d1c7b8;
      }
      #buku-misa-container .drive-fallback-container p {
        color: #5f3f1f;
        font-size: 14px;
        margin-bottom: 10px;
      }
      #buku-misa-container .drive-fallback-btn {
        display: inline-block;
        background: transparent;
        color: #966331;
        border: 2px solid #966331;
        padding: 10px 20px;
        border-radius: 6px;
        text-decoration: none;
        font-weight: 600;
        font-size: 14px;
        transition: all 0.3s ease;
      }
      #buku-misa-container .drive-fallback-btn:hover {
        background: #966331;
        color: #ffffff;
      }

      /* Modifier to place tooltip below an element with an upward arrow */
      #buku-misa-container .tooltip-bottom {
        top: 105%; /* Pushes it below the image */
        bottom: auto;
      }

      #buku-misa-container .tooltip-bottom::after {
        top: auto;
        bottom: 100%;
        border-color: transparent transparent #5f3f1f transparent; /* Flips arrow up */
      }

      /* === MOBILE RESPONSIVENESS === */
      @media (max-width: 768px) {
        #buku-misa-container {
          padding: 0 10px 20px;
        }
        #buku-misa-container .toolbar {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 8px;
          padding: 12px;
          top: 0;
        }
        #buku-misa-container #pdfList {
          grid-column: 1 / -1;
          width: 100%;
          padding: 12px;
        }
        #buku-misa-container #fullscreenBtn {
          grid-column: 1;
          width: 100%;
          padding: 12px;
          background: #73363a;
        }

        #buku-misa-container .zoom-controls {
          grid-column: 1 / -1;
          width: 100%;
          padding: 12px;
        }
        #buku-misa-container #refreshBtn {
          grid-column: 2;
          width: 100%;
          padding: 12px;
        }
        #buku-misa-container #prevBtn {
          grid-column: 1;
          width: 100%;
          padding: 12px;
        }
        #buku-misa-container #nextBtn {
          grid-column: 2;
          width: 100%;
          padding: 12px;
        }
        #buku-misa-container #pageNumber {
          font-size: 14px;
          padding-bottom: 20px;
        }
      }

      /* === IFRAME AUTO-HEIGHT MODE ===
         Active only when the page runs inside an iframe (class added by JS).
         min-height must be removed, otherwise 100vh = iframe height and the
         iframe could never shrink back. */
      html.embedded #buku-misa-container {
        min-height: 0;
      }
      /* Parent has confirmed it resizes the iframe -> hide the inner scrollbar */
      html.embedded.autosized,
      html.embedded.autosized body {
        overflow: hidden;
      }
      /* The iframe is as tall as the whole page, so "fixed" overlays would be
         centered on the whole page instead of what the visitor can see.
         The parent sends the visible slice (--vp-top / --vp-height). */
      html.embedded.autosized:not(.fs-active) #buku-misa-container #loading,
      html.embedded.autosized:not(.fs-active) .lightbox-overlay {
        inset: auto;
        left: 0;
        right: 0;
        top: var(--vp-top, 0px);
        height: var(--vp-height, 100vh);
      }
      html.embedded.autosized:not(.fs-active) .swal2-container {
        inset: auto !important;
        left: 0 !important;
        right: 0 !important;
        top: var(--vp-top, 0px) !important;
        height: var(--vp-height, 100vh) !important;
      }
    </style>
  </head>
  <body>
    <div id="buku-misa-container">
      <div id="loading">Mempersiapkan Teks Misa...</div>

      <div class="viewer">
        <div class="toolbar">
          <select id="pdfList"></select>

          <!-- === CORRECTED HTML: Move the span inside the zoom-controls div === -->
          <div class="zoom-controls">
            <label for="zoomSlider">Zoom:</label>
            <input
              type="range"
              id="zoomSlider"
              min="1"
              max="3"
              step="0.1"
              value="1"
            />

            <!-- Tooltip is now INSIDE the div -->
            <span id="zoomTooltip" class="zoom-tooltip">
              Saat teks misa diperbesar, gunakan tombol
              <strong>SEBELUMNYA</strong> dan <strong>SELANJUTNYA</strong> untuk
              pindah halaman.
            </span>
          </div>

          <button type="button" id="fullscreenBtn">LAYAR PENUH</button>
          <button type="button" id="refreshBtn">PERBARUI PDF</button>
          <button type="button" id="prevBtn">SEBELUMNYA</button>
          <button type="button" id="nextBtn">SELANJUTNYA</button>
        </div>

        <div id="flipbook-wrapper">
          <div id="flipbook"></div>
        </div>
        <div id="pageNumber">1 / 1</div>

        <div class="drive-fallback-container">
          <p>Teks Misa bermasalah?</p>
          <a
            href="https://drive.google.com/drive/folders/19-7BXn23MOd8OVgMKxQal00BUERXAMO1"
            target="_blank"
            rel="noopener noreferrer"
            class="drive-fallback-btn"
          >
            Akses Teks Misa di Google Drive
          </a>
        </div>

        <div id="pdf-links-section" style="display: none">
          <h3>Tautan Terkait (Links)</h3>
          <ul id="pdf-links-list"></ul>
        </div>

        <div
          id="image"
          style="position: relative; margin-top: 30px; cursor: pointer"
        >
          <!-- Added tooltip-bottom class -->
          <span id="imageTooltip" class="zoom-tooltip tooltip-bottom">
            <strong>Ketuk gambar</strong> untuk memperbesar & memindai QR Code.
          </span>

          <img
            id="qrThumbnail"
            loading="lazy"
            decoding="async"
            src="https://katedralsemarang.or.id/wp-content/uploads/2026/02/SLIDE-INFO-RUTIN.019.webp"
            alt="Gambar Teks Misa"
            style="
              width: 100%;
              border-radius: 8px;
              box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
              transition: transform 0.2s ease;
            "
          />
        </div>

        <!-- The Lightbox Overlay -->
        <div id="qrLightbox" class="lightbox-overlay">
          <span class="lightbox-close">&times;</span>
          <div class="lightbox-scroll-wrapper">
            <img id="qrLightboxImg" src="" alt="Zoomed QR Code" />
          </div>
        </div>
      </div>
    </div>

    <script type="module">
      pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

      // === CACHE SYSTEM ===
      const pdfCache = {};

      // === MODAL LOGIC (SweetAlert2) ===
      const showDndReminder = () => {
        if (!sessionStorage.getItem("dndReminderSeen")) {
          Swal.fire({
            iconHtml:
              '<span style="font-size: 40px; color: #966331;">🔕</span>',
            title:
              '<span style="color: #966331; font-family: Lora, serif; font-size: 24px;">Mohon Hening</span>',
            html: `
        <p style="color: #4a4a4a; font-size: 15px; line-height: 1.6; margin: 10px 0 0 0;">
          Harap 
          <strong>mengaktifkan mode Jangan Ganggu (Do Not Disturb) / Hening</strong> 
          pada perangkat Anda agar Perayaan Ekaristi dapat berjalan dengan khusyuk.
        </p>
      `,
            confirmButtonText: "Baik, Mengerti",
            confirmButtonColor: "#966331",
            background: "#f7f5f0",
            customClass: {
              popup: "swal2-border-theme",
            },
            allowOutsideClick: false,
          }).then(() => {
            sessionStorage.setItem("dndReminderSeen", "true");
          });
        }
      };

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", showDndReminder);
      } else {
        showDndReminder();
      }

      // === FULLSCREEN LOGIC ===
      const fullscreenBtn = document.getElementById("fullscreenBtn");
      const container = document.getElementById("buku-misa-container");

      fullscreenBtn.addEventListener("click", () => {
        if (!document.fullscreenElement) {
          if (container.requestFullscreen) {
            container.requestFullscreen();
          } else if (container.webkitRequestFullscreen) {
            container.webkitRequestFullscreen();
          }
        } else {
          if (document.exitFullscreen) {
            document.exitFullscreen();
          } else if (document.webkitExitFullscreen) {
            document.webkitExitFullscreen();
          }
        }
      });

      const handleFullscreenStyles = () => {
        document.documentElement.classList.toggle(
          "fs-active",
          !!(document.fullscreenElement || document.webkitFullscreenElement),
        );
        // ---> NEW: Reset the zoom slider and trigger the update <---
        const zoomSlider = document.getElementById("zoomSlider");
        if (zoomSlider) {
          zoomSlider.value = 1;
          zoomSlider.dispatchEvent(new Event("input")); // This re-runs your zoom logic!
        }
        // -----------------------------------------------------------
        // Check for both standard and webkit (Safari/Older iOS) fullscreen elements
        if (document.fullscreenElement || document.webkitFullscreenElement) {
          fullscreenBtn.innerText = "TUTUP LAYAR PENUH";
          container.style.minHeight = "100vh";
          container.style.height = "100vh"; // Lock height to monitor viewport
          container.style.borderRadius = "0";
          container.style.overflowY = "auto"; // FIX: Enables vertical scrolling
          container.style.paddingBottom = "50px"; // Adds breathing room at the bottom
        } else {
          fullscreenBtn.innerText = "LAYAR PENUH";
          container.style.minHeight =
            document.documentElement.classList.contains("embedded") ||
            document.getElementById("misa-widget-root")
              ? "0"
              : "100dvh";
          container.style.height = "auto";
          container.style.borderRadius = "0";
          container.style.overflowY = "visible";
          container.style.paddingBottom = "30px";
        }
      };

      // Listen to both standard and WebKit fullscreen events for better compatibility
      document.addEventListener("fullscreenchange", handleFullscreenStyles);
      document.addEventListener(
        "webkitfullscreenchange",
        handleFullscreenStyles,
      );
      // === REFRESH LOGIC ===
      const refreshBtn = document.getElementById("refreshBtn");
      refreshBtn.addEventListener("click", () => {
        // Define how many minutes the cooldown increments by per click
        const incrementMinutes = 2;

        let clickCount = parseInt(
          sessionStorage.getItem("pdfRefreshCount") || "0",
        );
        let nextAllowedTime = parseInt(
          sessionStorage.getItem("pdfNextAllowedTime") || "0",
        );
        let currentTime = Date.now();

        // 1. Check if the user is currently in a cooldown period
        if (currentTime < nextAllowedTime) {
          let remainingMs = nextAllowedTime - currentTime;
          let remainingMinutes = Math.ceil(remainingMs / (60 * 1000));

          alert(
            `Terlalu banyak permintaan. Mohon tunggu sekitar ${remainingMinutes} menit lagi sebelum memperbarui PDF.`,
          );
          return; // Stop execution
        }

        // 2. If no cooldown, proceed with the refresh
        updateDropdownAndPDF(false);

        // 3. Update the click count
        clickCount++;
        sessionStorage.setItem("pdfRefreshCount", clickCount.toString());

        // 4. Calculate the next cooldown penalty
        // (e.g., 1st click = 2 mins, 2nd click = 4 mins, 3rd click = 6 mins)
        let penaltyMinutes = clickCount * incrementMinutes;
        let newAllowedTime = currentTime + penaltyMinutes * 60 * 1000;

        sessionStorage.setItem("pdfNextAllowedTime", newAllowedTime.toString());
      });

      // The GAS URL is split and Base64 encoded to prevent casual scraping from the page source.
      const _0x1a = "aHR0cHM6Ly9zY3JpcHQuZ29vZ2xlLmNvbS9tYWNyb3Mvcy9BS2Z";
      const _0x2b = "5Y2J6VGVza1Vfd2FNWWxid0lvZnRkTlRCQ3RvdkpPaERsZ1dON3";
      const _0x3c = "dvdFMzSWhXcnRRTVhtMXBPaFQ3N1MwWjhiV2dSUnVoQS9leGVj";

      // The browser silently decodes and merges these parts back into your original URL
      const GAS_URL = atob(_0x1a + _0x2b + _0x3c);
      let pageFlip = null;
      let singlePageMode = false;

      async function updateDropdownAndPDF(isInitialLoad = true) {
        const list = document.getElementById("pdfList");
        const previousSelection = list.value;

        if (!isInitialLoad) {
          const loadingScreen = document.getElementById("loading");
          loadingScreen.style.display = "flex";
          loadingScreen.innerText = "Memperbarui Teks Misa...";
        }

        try {
          const res = await fetch(GAS_URL);
          const data = await res.json();
          list.innerHTML = "";

          data.forEach((pdf) => {
            let option = document.createElement("option");
            option.value = pdf.id;
            option.textContent = pdf.name.replace(".pdf", "");
            list.appendChild(option);
          });

          if (data.length > 0) {
            const stillExists = data.some(
              (pdf) => pdf.id === previousSelection,
            );
            const targetId =
              !isInitialLoad && stillExists ? previousSelection : data[0].id;
            list.value = targetId;

            if (!isInitialLoad) {
              delete pdfCache[targetId];
            }
            loadPDF(targetId);
          } else {
            document.getElementById("loading").innerText =
              "Tidak ada file PDF di Google Drive.";
          }
        } catch (error) {
          console.error("Gagal mengambil daftar PDF:", error);
          // document.getElementById("loading").innerText =
          // "Gagal menghubungi server.";

          document.getElementById("loading").innerHTML = `
        <div style="text-align: center; padding: 0 20px;">
          <p style="margin-bottom: 15px;">Gagal menghubungi server.</p>
          <a href="https://drive.google.com/drive/folders/19-7BXn23MOd8OVgMKxQal00BUERXAMO1" target="_blank" rel="noopener noreferrer" 
             style="background: #966331; color: white; padding: 12px 20px; border-radius: 6px; text-decoration: none; font-weight: bold; display: inline-block; font-size: 16px;">
            Akses Teks Misa di Google Drive
          </a>
        </div>
      `;
          // setTimeout(() => {
          //   document.getElementById("loading").style.display = "none";
          // }, 5000);
        }
      }

      const loadingScreen = document.getElementById("loading");
      loadingScreen.style.display = "flex";
      loadingScreen.innerText = "Mempersiapkan Teks Misa...";

      updateDropdownAndPDF(true);
      // NEW: Global variable for our timer so we can clear it easily
      let slowLoadTimer;

      async function loadPDF(id) {
        const loadingScreen = document.getElementById("loading");
        loadingScreen.style.display = "flex";

        // Reset loading screen text to default
        loadingScreen.innerHTML =
          "Mempersiapkan Teks Misa...<br><span style='font-size:14px; font-weight:normal; margin-top:10px;'>Harap menunggu sebentar.</span>";

        // ---> NEW: The 15-Second Rescue Timer <---
        clearTimeout(slowLoadTimer); // Clear any old timers
        slowLoadTimer = setTimeout(() => {
          loadingScreen.innerHTML = `
        <div style="text-align: center; padding: 0 20px;">
          <p style="margin-bottom: 15px;">Halaman bermasalah?</p>
          <a href="https://drive.google.com/drive/folders/19-7BXn23MOd8OVgMKxQal00BUERXAMO1" target="_blank" rel="noopener noreferrer" 
             style="background: #966331; color: white; padding: 12px 20px; border-radius: 6px; text-decoration: none; font-weight: bold; display: inline-block; font-size: 16px;">
            Akses Teks Misa di Google Drive
          </a>
        </div>
      `;
        }, 15000); // 15000 milliseconds = 15 seconds
        // -----------------------------------------

        document.getElementById("prevBtn").onclick = (e) => {
          e.preventDefault(); // Blocks WordPress from scrolling up
          if (pageFlip) pageFlip.flipPrev();
        };
        document.getElementById("nextBtn").onclick = (e) => {
          e.preventDefault(); // Blocks WordPress from scrolling up
          if (pageFlip) pageFlip.flipNext();
        };

        const viewer = document.querySelector(".viewer");
        const isMobile = window.innerWidth < 768;
        viewer.style.maxWidth = singlePageMode || isMobile ? "600px" : "1200px";

        if (pageFlip) {
          pageFlip.destroy();
          pageFlip = null;
        }

        const wrapper = document.getElementById("flipbook-wrapper");
        wrapper.innerHTML = "";

        const containerWrapper = document.createElement("div");
        containerWrapper.id = "flipbook";
        wrapper.appendChild(containerWrapper);

        try {
          let base64String;

          // FIX: Caching base64 string to prevent DataCloneError crashes
          if (pdfCache[id]) {
            loadingScreen.innerText = "Mempersiapkan Halaman...";
            base64String = pdfCache[id];
          } else {
            loadingScreen.innerText = "Mengunduh Teks Misa...";
            const response = await fetch(`${GAS_URL}?action=getpdf&id=${id}`);
            if (!response.ok) throw new Error("HTTP " + response.status);
            base64String = await response.text();
            pdfCache[id] = base64String;
          }

          loadingScreen.innerText = "Mempersiapkan Halaman...";

          const pdfData = atob(base64String);
          const uint8Array = Uint8Array.from(pdfData, (c) => c.charCodeAt(0));

          const pdf = await pdfjsLib.getDocument({ data: uint8Array }).promise;
          const pages = [];

          // NEW: Array to store all extracted links
          const extractedLinks = [];
          const renderScale = isMobile ? 1.1 : 1.5;

          // 1. Create empty wrappers for all pages instantly
          for (let i = 1; i <= pdf.numPages; i++) {
            const div = document.createElement("div");
            div.className = "page";
            containerWrapper.appendChild(div);
            pages.push(div);
          }

          // 2. Helper function to render a single page and find its links
          const renderSinglePage = async (pageNum, wrapperDiv) => {
            const page = await pdf.getPage(pageNum);
            const viewport = page.getViewport({ scale: renderScale });
            const canvas = document.createElement("canvas");

            canvas.width = viewport.width;
            canvas.height = viewport.height;

            await page.render({
              canvasContext: canvas.getContext("2d"),
              viewport: viewport,
            }).promise;

            wrapperDiv.appendChild(canvas);

            // Extract links quietly
            const annotations = await page.getAnnotations();
            const linkAnnotations = annotations.filter(
              (a) => a.subtype === "Link" && a.url,
            );
            linkAnnotations.forEach((link) => {
              extractedLinks.push({ page: pageNum, url: link.url });
            });
          };

          // 3. ONLY render Page 1 and Page 2 right now so the user can start reading
          await renderSinglePage(1, pages[0]);
          if (pdf.numPages >= 2) {
            await renderSinglePage(2, pages[1]);
          }

          // ---> BARU: Tampilkan indikator proses tampilan dan beri waktu browser untuk memuatnya
          loadingScreen.innerText = "Memproses tampilan...";
          await new Promise((resolve) => setTimeout(resolve, 100)); // jeda sejenak agar teks muncul

          // 4. Initialize the Flipbook immediately using the partially filled pages
          const firstPage = await pdf.getPage(1);
          const vp = firstPage.getViewport({ scale: 1 });
          const pdfRatio = vp.height / vp.width;
          const wrapperWidth = wrapper.clientWidth;
          const baseWidth = isMobile
            ? Math.min(
                window.innerWidth - 20,
                wrapperWidth || window.innerWidth - 20,
              )
            : 550;
          const baseHeight = baseWidth * pdfRatio;

          pageFlip = new window.St.PageFlip(containerWrapper, {
            width: baseWidth,
            height: baseHeight,
            size: "stretch",
            usePortrait: singlePageMode || isMobile,
            minWidth: 280,
            maxWidth: 1000,
            minHeight: 380,
            maxHeight: 1500,
            showCover: false,
            mobileScrollSupport: true,
            swipeDistance: 70,
          });

          pageFlip.loadFromHTML(pages);

          pageFlip.on("flip", (e) => {
            document.getElementById("pageNumber").innerHTML =
              `Halaman ${e.data + 1} dari ${pageFlip.getPageCount()}`;
          });

          // 5. BACKGROUND TASK: Render the rest of the book silently
          const renderRestInBackground = async () => {
            // Start from page 3, since 1 and 2 are already done
            const startPage = pdf.numPages >= 2 ? 3 : 2;

            for (let i = startPage; i <= pdf.numPages; i++) {
              // Add a tiny 50ms pause between rendering pages
              await new Promise((resolve) => setTimeout(resolve, 50));
              await renderSinglePage(i, pages[i - 1]);
            }

            // Once ALL background pages are done, show the links UI
            const linksSection = document.getElementById("pdf-links-section");
            const linksList = document.getElementById("pdf-links-list");
            linksList.innerHTML = "";

            if (extractedLinks.length > 0) {
              const uniqueLinks = Array.from(
                new Set(extractedLinks.map((a) => a.url)),
              ).map((url) => extractedLinks.find((a) => a.url === url));

              uniqueLinks.forEach((item) => {
                const li = document.createElement("li");
                const a = document.createElement("a");
                a.href = item.url;
                a.target = "_blank";
                a.rel = "noopener noreferrer";
                a.innerText = `[Halaman ${item.page}] ${item.url}`;
                li.appendChild(a);
                linksList.appendChild(li);
              });
              linksSection.style.display = "block";
            } else {
              linksSection.style.display = "none";
            }
          };

          // Trigger the background render, but DO NOT "await" it. Let it run on its own!
          renderRestInBackground();

          // UI Updates on successful load of the first two pages
          document.getElementById("pageNumber").innerHTML =
            `Halaman 1 dari ${pdf.numPages}`;
          clearTimeout(slowLoadTimer);

          // ---> BARU: Tunda penutupan loading screen agar layar putih tertutupi
          setTimeout(() => {
            // 1. Sembunyikan loading screen TERLEBIH DAHULU agar layout kembali normal
            loadingScreen.style.display = "none";
            loadingScreen.innerText = "Mempersiapkan Teks Misa..."; // Kembalikan ke teks default

            // 2. Beri browser waktu sejenak untuk me-render, lalu paksa kalibrasi ulang
            requestAnimationFrame(() => {
              if (pageFlip) {
                pageFlip.update(); // Updates internal dimensions safely
              }
              window.dispatchEvent(new Event("resize"));
            });
          }, 1000); // Jeda 1 detik (1000ms).
        } catch (error) {
          console.error("Failed to load PDF:", error);

          // Stop the timer on error
          clearTimeout(slowLoadTimer);

          // Update how errors are displayed
          loadingScreen.innerHTML = `
        <p>Gagal memuat PDF.</p>
          <a href="https://drive.google.com/drive/folders/19-7BXn23MOd8OVgMKxQal00BUERXAMO1" target="_blank" rel="noopener noreferrer" 
             style="background: #966331; color: white; padding: 12px 20px; border-radius: 6px; text-decoration: none; font-weight: bold; display: inline-block; font-size: 16px;">
            Akses Teks Misa di Google Drive
          </a>
      `;
        }
      }

      // === ZOOM LOGIC ===
      const zoomSlider = document.getElementById("zoomSlider");
      let tooltipTimer; // NEW: Timer variable to control the tooltip disappearance

      // Shared helper so both the slider and the pinch gesture apply zoom identically
      function applyZoom(scaleValue) {
        const min = parseFloat(zoomSlider.min);
        const max = parseFloat(zoomSlider.max);
        const clamped = Math.min(max, Math.max(min, scaleValue));

        const flipbookElement = document.getElementById("flipbook");
        const flipbookWrapper = document.getElementById("flipbook-wrapper");
        const zoomTooltip = document.getElementById("zoomTooltip");
        const mainContainer = document.getElementById("buku-misa-container"); // Added to toggle CSS class

        zoomSlider.value = clamped;

        if (flipbookElement) {
          flipbookElement.style.transform = `scale(${clamped})`;

          // Get the actual base width and height of the flipbook
          const currentWidth = flipbookElement.offsetWidth;
          const currentHeight = flipbookElement.offsetHeight;

          if (clamped > 1) {
            // 1. Enable horizontal touch scrolling via CSS class
            mainContainer.classList.add("is-zoomed");

            flipbookWrapper.style.alignItems = "flex-start";
            flipbookWrapper.style.justifyContent = "flex-start";

            // 2. FIX SCROLLBARS: Compensate for the transformed size
            // By adding margins equal to the extra scaled width/height, the parent wrapper
            // finally knows exactly how far to allow scrolling.
            flipbookElement.style.marginRight = `${currentWidth * (clamped - 1)}px`;
            flipbookElement.style.marginBottom = `${currentHeight * (clamped - 1)}px`;

            if (zoomTooltip) {
              zoomTooltip.classList.add("show");
              clearTimeout(tooltipTimer);
              tooltipTimer = setTimeout(() => {
                zoomTooltip.classList.remove("show");
              }, 3500);
            }
          } else {
            // Reset and re-lock horizontal touch swiping for page turning
            mainContainer.classList.remove("is-zoomed");

            flipbookWrapper.style.alignItems = "center";
            flipbookWrapper.style.justifyContent = "center";
            flipbookWrapper.scrollTop = 0;
            flipbookWrapper.scrollLeft = 0;

            // Reset scroll margins
            flipbookElement.style.marginRight = "0px";
            flipbookElement.style.marginBottom = "0px";

            if (zoomTooltip) {
              zoomTooltip.classList.remove("show");
              clearTimeout(tooltipTimer);
            }
          }
        }
      }

      zoomSlider.addEventListener("input", (e) => {
        applyZoom(parseFloat(e.target.value));
      });

      // === SMART SWIPE INTERCEPTION ===
      const flipbookWrapper = document.getElementById("flipbook-wrapper");

      let touchStartX = 0;
      let touchStartY = 0;
      let isVerticalScroll = false;

      function handleTouchStartCapture(e) {
        if (e.touches && e.touches.length === 1) {
          touchStartX = e.touches[0].clientX;
          touchStartY = e.touches[0].clientY;
          isVerticalScroll = false; // Reset deteksi arah setiap sentuhan baru
        }
        blockPageFlipWhenZoomed(e);
      }

      function handleTouchMoveCapture(e) {
        const currentZoom = parseFloat(
          document.getElementById("zoomSlider").value,
        );

        // Jika pengguna tidak melakukan zoom, kita cek arah jarinya
        if (e.touches && e.touches.length === 1 && currentZoom === 1) {
          const deltaX = Math.abs(e.touches[0].clientX - touchStartX);
          const deltaY = Math.abs(e.touches[0].clientY - touchStartY);

          // Jika jari bergerak lebih dari 5px ke arah atas/bawah (Vertikal)
          if (!isVerticalScroll && deltaY > 5 && deltaY > deltaX) {
            isVerticalScroll = true;
          }

          // HIDE THE EVENT FROM PAGEFLIP: Jika pengguna sedang scroll vertikal,
          // hentikan event agar PageFlip tidak mengunci layar.
          if (isVerticalScroll) {
            e.stopPropagation();
            return;
          }
        }

        blockPageFlipWhenZoomed(e);
      }

      function blockPageFlipWhenZoomed(e) {
        const currentZoom = parseFloat(
          document.getElementById("zoomSlider").value,
        );
        const isMultiTouch = e.touches && e.touches.length > 1;

        // If the user is zoomed in OR pinching (multi-touch), stop the event from reaching the PageFlip plugin
        if (currentZoom > 1 || isMultiTouch || isPinching) {
          e.stopPropagation();
        }
      }

      // Use the capture phase (true) to intercept events BEFORE PageFlip processes them
      flipbookWrapper.addEventListener(
        "touchstart",
        handleTouchStartCapture,
        true,
      );
      flipbookWrapper.addEventListener(
        "touchmove",
        handleTouchMoveCapture,
        true,
      );
      flipbookWrapper.addEventListener(
        "mousedown",
        blockPageFlipWhenZoomed,
        true,
      );
      flipbookWrapper.addEventListener(
        "mousemove",
        blockPageFlipWhenZoomed,
        true,
      );

      // === PINCH-TO-ZOOM GESTURE (TOUCHSCREENS) ===
      let pinchStartDistance = 0;
      let pinchStartZoom = 1;
      let isPinching = false;

      function getTouchDistance(touches) {
        const dx = touches[0].clientX - touches[1].clientX;
        const dy = touches[0].clientY - touches[1].clientY;
        return Math.sqrt(dx * dx + dy * dy);
      }

      function handlePinchStart(e) {
        if (e.touches.length !== 2) return;

        isPinching = true;
        pinchStartDistance = getTouchDistance(e.touches);
        pinchStartZoom = parseFloat(zoomSlider.value) || 1;

        // Disable the CSS transition so zoom tracks the fingers instantly, without lag
        const flipbookElement = document.getElementById("flipbook");
        if (flipbookElement) flipbookElement.style.transition = "none";

        // Stop the native page pinch-zoom and PageFlip's own gesture handling
        e.preventDefault();
        e.stopPropagation();
      }

      function handlePinchMove(e) {
        if (!isPinching || e.touches.length !== 2) return;

        e.preventDefault();
        e.stopPropagation();

        const currentDistance = getTouchDistance(e.touches);
        const scaleRatio = currentDistance / pinchStartDistance;
        applyZoom(pinchStartZoom * scaleRatio);
      }

      function handlePinchEnd(e) {
        if (e.type !== "touchcancel" && e.touches.length >= 2) return;

        isPinching = e.type !== "touchcancel" && e.touches.length === 1;
        const flipbookElement = document.getElementById("flipbook");
        if (flipbookElement && !isPinching)
          flipbookElement.style.transition = "";
      }

      // passive: false is required so preventDefault() can actually block native zoom/scroll
      flipbookWrapper.addEventListener("touchstart", handlePinchStart, {
        capture: true,
        passive: false,
      });
      flipbookWrapper.addEventListener("touchmove", handlePinchMove, {
        capture: true,
        passive: false,
      });
      flipbookWrapper.addEventListener("touchend", handlePinchEnd, {
        capture: true,
        passive: false,
      });
      flipbookWrapper.addEventListener("touchcancel", handlePinchEnd, {
        capture: true,
        passive: false,
      });

      // Reset zoom when a new PDF is loaded
      document
        .getElementById("pdfList")
        .addEventListener("change", function () {
          zoomSlider.value = 1; // Reset slider UI
          applyZoom(1);
          loadPDF(this.value);
        });

      // FIX: Smart Resize. Only triggers if the screen WIDTH changes (e.g. rotating phone).
      // Prevents intense lag when scrolling up/down hides the mobile browser address bar.
      let lastWidth = window.innerWidth;
      let wasMobile = window.innerWidth < 768;
      window.addEventListener("resize", () => {
        clearTimeout(window.resizeTimer);
        window.resizeTimer = setTimeout(() => {
          if (window.innerWidth === lastWidth) return;
          lastWidth = window.innerWidth;
          const nowMobile = window.innerWidth < 768;
          if (nowMobile !== wasMobile) {
            // Layout mode changed (single <-> double page): rebuild the book
            wasMobile = nowMobile;
            const id = document.getElementById("pdfList").value;
            if (id) loadPDF(id);
          } else if (pageFlip) {
            // Same mode (e.g. entering/leaving fullscreen): just resize, no reload
            pageFlip.update();
          }
        }, 300);
      });

      // === LIGHTBOX & SCROLL TOOLTIP LOGIC ===
      const qrImageContainer = document.getElementById("image");
      const qrThumbnail = document.getElementById("qrThumbnail");
      const qrLightbox = document.getElementById("qrLightbox");
      const qrLightboxImg = document.getElementById("qrLightboxImg");
      const imageTooltip = document.getElementById("imageTooltip");

      // 1. Lightbox Click Events
      if (qrThumbnail && qrLightbox) {
        qrThumbnail.addEventListener("click", () => {
          qrLightboxImg.src = qrThumbnail.src; // Copy source to lightbox
          qrLightbox.classList.add("show");
          imageTooltip.classList.remove("show"); // Hide tooltip if it was visible
        });

        // Close lightbox when clicking anywhere on the overlay
        qrLightbox.addEventListener("click", () => {
          qrLightbox.classList.remove("show");
        });
      }

      // 2. Intersection Observer to trigger the tooltip on scroll
      if (qrImageContainer && imageTooltip) {
        const observer = new IntersectionObserver(
          (entries) => {
            entries.forEach((entry) => {
              // When the image enters the viewport
              if (entry.isIntersecting) {
                imageTooltip.classList.add("show");

                // Auto-hide the tooltip after 4 seconds
                setTimeout(() => {
                  imageTooltip.classList.remove("show");
                }, 4000);

                // Unobserve so the tooltip only triggers once per page load
                observer.unobserve(qrImageContainer);
              }
            });
          },
          { threshold: 0.6 },
        ); // Triggers when 60% of the image is visible on screen

        observer.observe(qrImageContainer);
      }

      // === IFRAME AUTO-HEIGHT (talks to the parent page via postMessage) ===
      (function () {
        if (window.parent === window) return; // opened directly, not in an iframe
        const root = document.documentElement;
        root.classList.add("embedded");

        const box = document.getElementById("buku-misa-container");
        let lastSent = 0;
        let queued = false;

        function reportHeight() {
          queued = false;
          // In fullscreen the page fills the screen; don't resize the iframe
          if (document.fullscreenElement || document.webkitFullscreenElement)
            return;
          const h = Math.ceil(
            Math.max(
              box.getBoundingClientRect().height,
              document.body.scrollHeight,
            ),
          );
          if (!h || h === lastSent) return;
          lastSent = h;
          window.parent.postMessage({ type: "misa-height", height: h }, "*");
        }

        function scheduleReport() {
          if (queued) return;
          queued = true;
          requestAnimationFrame(reportHeight);
        }

        // Any layout change (PDF pages render, zoom, links list, image loads...)
        const ro = new ResizeObserver(scheduleReport);
        ro.observe(box);
        ro.observe(document.body);
        window.addEventListener("load", scheduleReport);
        window.addEventListener("resize", scheduleReport);
        document.addEventListener("fullscreenchange", () => {
          lastSent = 0;
          scheduleReport();
        });
        document.addEventListener("webkitfullscreenchange", () => {
          lastSent = 0;
          scheduleReport();
        });
        if (document.fonts && document.fonts.ready)
          document.fonts.ready.then(scheduleReport);
        scheduleReport();

        // Parent tells us which slice of this (tall) page is on screen
        window.addEventListener("message", (e) => {
          if (e.source !== window.parent) return;
          const d = e.data;
          if (!d || d.type !== "misa-viewport") return;
          root.classList.add("autosized");
          root.style.setProperty("--vp-top", d.top + "px");
          root.style.setProperty("--vp-height", d.height + "px");
        });
      })();
    </script>
